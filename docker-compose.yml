# Entorno local completo: docker compose up --build
# Frontend: http://localhost:8080 · API Gateway: http://localhost:8000/docs
x-comun: &comun
  INTERNAL_TOKEN: token-interno-local
  DATABASE_URL: postgresql://agro:agro@postgres:5432/agroconecta

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro
      POSTGRES_DB: agroconecta
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agroconecta"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api-gateway:
    build: ./api-gateway
    ports: ["8000:8000"]
    environment:
      <<: *comun
      DB_SCHEMA: auth
      JWT_SECRET: secreto-jwt-local
      CATALOGO_URL: http://catalogo-service:8000
      PEDIDOS_URL: http://pedidos-service:8000
      PAGOS_URL: http://pagos-service:8000
      NOTIFICACIONES_URL: http://notificaciones-service:8000
    depends_on:
      postgres: { condition: service_healthy }

  catalogo-service:
    build: ./catalogo-service
    environment:
      <<: *comun
      DB_SCHEMA: catalogo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  pedidos-service:
    build: ./pedidos-service
    environment:
      <<: *comun
      DB_SCHEMA: pedidos
      REDIS_URL: redis://redis:6379/0
      CATALOGO_URL: http://catalogo-service:8000
      PAGOS_URL: http://pagos-service:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  pagos-service:
    build: ./pagos-service
    environment:
      <<: *comun
      DB_SCHEMA: pagos
      PASARELA_TASA_FALLO: "0"
    depends_on:
      postgres: { condition: service_healthy }

  notificaciones-service:
    build: ./notificaciones-service
    environment:
      INTERNAL_TOKEN: token-interno-local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]

volumes:
  pgdata:
